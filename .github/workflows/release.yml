name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build: npx --no-install electron-builder --mac --publish never
          - os: windows-latest
            platform: win
            build: npx --no-install electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build installer (${{ matrix.platform }})
        run: ${{ matrix.build }}
        env:
          # 未做付费签名（内部工具），跳过公证
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: bash
        run: ls -lh dist-mini/ || dir dist-mini

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-mini/*.dmg
            dist-mini/*.zip
            dist-mini/*.exe
            dist-mini/*.yml
            dist-mini/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
