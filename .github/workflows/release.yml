name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build: npx --no-install electron-builder --mac --publish never
          - os: windows-latest
            platform: win
            build: npx --no-install electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Test live wall
        run: npm run test:mini

      - name: Build installer (${{ matrix.platform }})
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Save installers and update files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-mini/*.dmg
            dist-mini/*.zip
            dist-mini/*.exe
            dist-mini/latest*.yml
            dist-mini/*.blockmap

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify update manifests and checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path('release-assets')
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          for name in ('latest.yml', 'latest-mac.yml'):
              lines = (root / name).read_text().splitlines()
              assert f'version: {version}' in lines, f'{name}: version mismatch'
              asset = None
              for line in lines:
                  value = line.strip()
                  if value.startswith('- url: '):
                      asset = root / value.removeprefix('- url: ').strip()
                      assert asset.is_file(), f'missing {asset}'
                  elif asset and value.startswith('sha512: '):
                      expected = value.removeprefix('sha512: ').strip()
                      actual = base64.b64encode(hashlib.sha512(asset.read_bytes()).digest()).decode()
                      assert actual == expected, f'{asset}: checksum mismatch'
                      asset = None
          files = sorted(p for p in root.iterdir() if p.is_file())
          (root / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish complete release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
